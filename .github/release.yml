# GitHub 自动发行说明分类（Releases 页面「Generate release notes」会用这份配置）
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 零甲层（#97–#100）
      labels: [zero-armor]
    - title: 宿主补丁
      labels: [patches]
    - title: 新功能
      labels: [enhancement, feature]
    - title: 修复
      labels: [bug, fix]
    - title: 文档与环境
      labels: [docs, environment, ios]
    - title: 其他
      labels: ["*"]
